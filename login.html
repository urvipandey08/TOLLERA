<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | TOLLÉRA</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <div class="brandmark-login">TOLLÉRA</div>
      <div class="login-subtitle">AUTOMATED TOLL OPERATIONS</div>

      <h2 id="formTitle">Welcome back</h2>
      <p class="login-desc" id="formDesc">Sign in to access your toll operations dashboard.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          autocomplete="username"
          placeholder="operator@tollera.system"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button type="submit" id="loginButton">Sign in</button>

        <div class="divider">OR</div>

        <button type="button" class="secondary-btn" id="guestBtn">
          Continue as Demo Operator
        </button>

        <div id="loginMessage" class="msg" role="status" aria-live="polite"></div>

        <div class="toggle-mode">
          <span id="toggleText">Need a new operator account?</span>
          <a id="toggleModeBtn">Create account</a>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
